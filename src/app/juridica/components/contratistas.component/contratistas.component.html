<div class="card jungle-card h-100 mt-3">
  <div class="card-body d-flex flex-column justify-content-between">
    <!-- Nombre con azul vivo -->
    <h5 class="card-title jungle-title">
      {{ contratista().nombre }}
    </h5>

    <!-- Documento -->
    <p class="card-text">
      <strong>Documento:</strong> {{ contratista().cedula_nit }}
    </p>

    <!-- Chip y botón -->
    <div class="d-flex justify-content-between align-items-center mt-3">
      <span class="chip chip-loro">{{ contratista().tipo_persona }}</span>
      <a class="btn-tucan text-decoration-none">
        <i class="bi bi-info-circle"></i> Detalles
      </a>
    </div>
  </div>
</div>
