<nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" routerLink="/"> | </a>

        <button class="navbar-toggler" type="button" (click)="isMenuCollapsed = !isMenuCollapsed">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed" id="navbarNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                @for( page of pagesRnder(); track page ) {
                <li class="nav-item">
                    <a class="nav-link" [routerLink]="page" (click)="isMenuCollapsed = true" routerLinkActive="text-dark fw-bold">
                        {{ page }}
                    </a>
                </li>
                }
            </ul>
        </div>
    </div>
</nav>
