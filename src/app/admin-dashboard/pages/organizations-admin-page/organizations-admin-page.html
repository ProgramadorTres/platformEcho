<h1 class="fs-2 fw-bold">Listado de organizaciones</h1>
<h3 class="fs-5">
  Total de organizaciones
  <span class="text-primary">{{ organizationsResource.value()?.count ?? 0 }}</span>
</h3>
<div class="my-2"></div>

@if (organizationsResource.error()) {
<div class="alert alert-danger d-flex align-items-center" role="alert">
  <div>
    Error al cargar organizaciones
  </div>
</div>
}@else{
    <div class="row">
  <div class="col-12">
    <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
      <div class="d-flex align-items-center">
        <app-pagination [pages]="organizationsResource.value()?.pages ?? 0"
          [currentPage]="paginationService.currentPage()" />
      </div>

      <div class="d-flex align-items-center" style="margin-top: -1rem;">
        <select (change)="organizationsPerPage.set(+selectPerPage.value)" #selectPerPage
          class="form-select form-select-sm w-auto" style="min-width: 5rem; height: 2.25rem;">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <!-- Botón alineado al borde derecho -->
      <button routerLink="/admin/contratistas/new" class="btn btn-primary ms-auto d-flex align-items-center gap-1"
        style="min-width: 5rem; margin-top: -16px; height: 2.25rem;">
        <i class="bi bi-plus-circle"></i>
        Nueva organizacion
      </button>

    </div>
  </div>
</div>

<organizations-search   (search)="onSearch($event)" />
<organizations-table [organizations]="filteredOrganizations()"/>



}
