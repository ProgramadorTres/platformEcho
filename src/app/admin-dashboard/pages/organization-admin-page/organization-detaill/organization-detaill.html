<div class="main-page-background py-5">
    <div class="form-container-limited mx-auto">
        
        <form [formGroup]="organizationForm" (ngSubmit)="OrganizationOnSubmit()" class="position-relative">
            
            <div class="timeline-vertical-line d-none d-lg-block"></div>

            <div class="d-flex flex-column gap-4 timeline-content-padding">

                <div class="header-card shadow-sm mb-2">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="header-icon-box">
                                <i class="bi bi-building-fill-add"></i>
                            </div>
                            <div>
                                <h1 class="header-main-title">Nueva Organización</h1>
                                <p class="header-subtitle">Panel de registro y categorización legal</p>
                            </div>
                        </div>
                        <div class="header-tag">
                            <i class="bi bi-info-circle me-1"></i> Módulo de Gestión
                        </div>
                    </div>
                </div>

                <section class="floating-card shadow-sm">
                    <div class="card-header-custom">
                        <span class="step-indicator step-primary">1</span>
                        <h5>Identidad Organizacional</h5>
                    </div>
                    <div class="card-body-custom">
                        <div class="row g-4">
                            <div class="col-lg-4">
                                <label class="label-custom">ID Organización *</label>
                                <input type="text" class="input-custom" formControlName="id_organización" placeholder="Ej: ORG-100" />
                                <form-error-label [control]="organizationForm.get('id_organización')!" />
                            </div>
                            <div class="col-lg-8">
                                <label class="label-custom">Nombre Legal *</label>
                                <input type="text" class="input-custom" formControlName="nombre_organización" />
                            </div>
                            <div class="col-lg-4">
                                <label class="label-custom">NIT</label>
                                <input type="number" class="input-custom" formControlName="NIT" />
                            </div>
                            <div class="col-lg-2">
                                <label class="label-custom">DV</label>
                                <input type="number" class="input-custom text-center" formControlName="dígito_verificación_NIT" />
                            </div>
                        </div>
                    </div>
                </section>

                <div class="row g-4">
                    <div class="col-xl-6">
                        <section class="floating-card shadow-sm h-100">
                            <div class="card-header-custom">
                                <span class="step-indicator step-secondary">2</span>
                                <h5>Detalles Operativos</h5>
                            </div>
                            <div class="card-body-custom">
                                <div class="mb-4">
                                    <label class="label-custom">Tipo de Organización *</label>
                                    <ng-select class="select-custom" formControlName="id_tipo_organizacion" [items]="orgTypesResource.value() ?? []" bindLabel="tipo_organización" bindValue="ID"></ng-select>
                                </div>
                                <div>
                                    <label class="label-custom">Responsable Directo</label>
                                    <input type="text" class="input-custom" formControlName="responsable_organización" />
                                </div>
                            </div>
                        </section>
                    </div>
                    <div class="col-xl-6">
                        <section class="floating-card shadow-sm h-100">
                            <div class="card-header-custom">
                                <span class="step-indicator step-secondary">3</span>
                                <h5>Información de Contacto</h5>
                            </div>
                            <div class="card-body-custom">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="label-custom">Teléfono Movil/Fijo</label>
                                        <input type="text" class="input-custom" formControlName="teléfono_organización" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="label-custom">Correo Electrónico</label>
                                        <input type="email" class="input-custom" formControlName="e-mail_organización" />
                                    </div>
                                    <div class="col-12 mt-2">
                                        <label class="label-custom">País de Residencia</label>
                                        <ng-select class="select-custom" formControlName="id_pais" [items]="orgCountriesResource.value() ?? []" bindLabel="país_organización" bindValue="id_pais"></ng-select>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>

                <section class="floating-card shadow-sm border-start-warning">
                    <div class="card-header-custom">
                        <span class="step-indicator step-warning text-dark">4</span>
                        <h5 class="text-warning-emphasis">Evaluación y Calificaciones</h5>
                    </div>
                    <div class="card-body-custom">
                        <div class="row g-5 align-items-center">
                            <div class="col-lg-4 border-end text-center">
                                <p class="label-custom mb-3">Puntaje Técnico</p>
                                <div class="score-box mx-auto">
                                    <input type="number" formControlName="calificacion_tecnica" class="score-input" min="0" max="100">
                                    <span class="score-sep">/ 100</span>
                                </div>
                            </div>
                            <div class="col-lg-8">
                                <label class="label-custom">Observaciones Administrativas</label>
                                <textarea class="input-custom mb-3" formControlName="coment_calif_tecnica" rows="3" placeholder="Detalles de la auditoría técnica..."></textarea>
                                <textarea class="input-custom" formControlName="calificacion_admin" rows="2" placeholder="Resumen de gestión..."></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="d-flex justify-content-end align-items-center gap-3 mt-2 mb-5 pe-2">
                    @if(wasSaved()){
                        <div class="status-saved">
                            <i class="bi bi-cloud-check-fill me-2"></i> {{ saveMessage() }}
                        </div>
                    }
                    <div class="d-flex gap-2">
                        <btn-home [pathToGo]="'organizaciones'" class="btn-square-alt" />
                        <button class="btn-square-primary shadow-sm" type="submit">
                            <i class="bi bi-save2 me-2"></i> GUARDAR REGISTRO
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
