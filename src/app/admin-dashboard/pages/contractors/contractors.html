<h1 class="fs-2 fw-bold">Listado de contratistas</h1>
<h3 class="fs-5">
    Total de contratistas
    <span class="text-primary">{{ contractorssResource.value()?.count ?? 0 }}</span>
</h3>
<div class="my-2"></div>


@if (contractorssResource.error()) {
<div class="alert alert-danger d-flex align-items-center" role="alert">
    <div>
        Error al cargar productos
    </div>
</div>
}@else{
<div class="row">
  <div class="col-12">
    <div class="d-flex flex-wrap align-items-center gap-3 mt-4" >
      <div class="d-flex align-items-center">
        <app-pagination
          [pages]="contractorssResource.value()?.pages ?? 0"
          [currentPage]="paginationService.currentPage()" />
      </div>

      <div class="d-flex align-items-center" style="margin-top: -1rem;">
        <select (change)="productsPerPage.set(+selectPerPage.value)" #selectPerPage
          class="form-select form-select-sm w-auto"
          style="min-width: 5rem; height: 2.25rem;">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>
  </div>
</div>

}
