<h1 class="fs-2 fw-bold text-wrap">  {{ titlePage }}</h1>
<h3 class="fs-6 text-muted">
  Total de contratistas:
  <span class="text-primary fw-bold">{{ contractorssResource.value()?.count ?? 0 }}</span>
</h3>

@if (contractorssResource.error()) {
  <div class="alert alert-danger d-flex align-items-center mt-3" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div>Error al cargar contratistas</div>
  </div>
} @else {
  <div class="row mt-4 mb-3 g-3">
    <div class="col-12">
      <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-3">
        
        <div class="d-flex justify-content-center justify-content-md-start overflow-auto py-1">
          <app-pagination 
            [pages]="contractorssResource.value()?.pages ?? 0"
            [currentPage]="paginationService.currentPage()" />
        </div>

        <div class="d-flex align-items-center">
          <select (change)="contractsPerPage.set(+selectPerPage.value)" #selectPerPage
            class="form-select form-select-sm" style="width: 100%; min-width: 5rem; height: 2.5rem;" style="margin-top: -.8rem ;">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>

        <div class="ms-md-auto">
          <button routerLink="/admin/contratistas/new" 
            class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
            style="height: 2.5rem; white-space: nowrap; margin-top: -.8rem ;" >
            <span>Nuevo contratista</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="mb-4">
    <search-component  (search)="onSearch($event)"/> 
  </div>
  
  <div class="table-responsive shadow-sm rounded border">
     <projects-contracts-table [contractors]="filteredProducts()" />
    
  </div>
}
