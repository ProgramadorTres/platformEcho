<div class="bg-light text-secondary vh-100 vw-100 overflow-auto">

  <button class="btn btn-dark d-lg-none position-fixed top-0 start-0 m-2 shadow-sm" style="z-index: 1050;"
    (click)="menuOpen = !menuOpen">
    <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen"></i>
  </button>

  <div class="d-flex position-relative vw-100">

    <div id="menu" class="bg-dark text-light position-fixed start-0 top-0 vh-100 overflow-auto sidebar-transition"
      [class.d-none]="!menuOpen" [class.d-lg-block]="true" style="width: 16rem; z-index: 1040;">

      <div id="logo" class="my-4 px-3">
        <h1 class="fs-4 fw-bold text-white" style="cursor: pointer;" routerLink="/">
          Echo <span class="text-primary">| Fpn</span>
        </h1>
        <p class="text-muted small">Manage your actions and activities</p>
      </div>

      <div id="profile" class="px-3 py-4">
        <p class="text-muted mb-2 small">Bienvenido,</p>
        <div class="d-inline-flex align-items-center gap-2 text-decoration-none">
          <img class="rounded-circle border border-secondary" style="width: 32px; height: 32px;"
            src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?ixlib=rb-4.0.3&auto=format&fit=crop&w=128&q=80"
            alt="User">
          <span class="fw-bold small text-white">{{ user()?.fullName }}</span>
        </div>
      </div>

      <nav id="nav" class="w-100 px-3">
        @for( menuOption of menuOptions; track menuOption.label ) {
        <a (click)="selectMenu(menuOption); menuOpen = false" style="cursor: pointer;"
          [class.bg-primary]="selectedOption === menuOption" [class.text-white]="selectedOption === menuOption"
          [class.text-light]="selectedOption !== menuOption"
          class="w-100 px-2 d-flex align-items-center gap-2 border-bottom border-secondary py-3 text-decoration-none hover-effect transition-all">

          <i [class]="menuOption.icon"></i>

          <div class="d-flex flex-column">
            <span class="fw-bold small">{{ menuOption.label }}</span>
            <span class="small d-none d-md-block" [class.text-white-50]="selectedOption !== menuOption"
              [class.text-white]="selectedOption === menuOption" style="font-size: 0.7rem;">
              {{ menuOption.subLAbel }}
            </span>
          </div>
        </a>
        }

        <button class="btn btn-outline-danger btn-sm w-100 mt-4 mb-4" (click)="authService.logout()">
          <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
        </button>
      </nav>
    </div>

    <main class="flex-grow-1 pt-3 px-3 main-content">
      <div class="container-fluid">
        <user-top-menu [pagesRnder]="selectedPages" />
        <div class="mt-4">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>

    @if (menuOpen) {
    <div class="d-lg-none position-fixed top-0 start-0 w-100 h-100 bg-black opacity-50" style="z-index: 1030;"
      (click)="menuOpen = false"></div>
    }

  </div>
</div>
