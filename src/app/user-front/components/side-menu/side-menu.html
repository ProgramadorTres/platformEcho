<div id="nav" class="w-100 px-3 " style="background-color: black;">
  @for (item of menuOptions; track item.route) {
  <a
    [routerLink]="item.route"
    routerLinkActive="bg-primary"
    class="w-100 px-2 d-inline-flex align-items-center border-bottom border-secondary py-3 text-decoration-none hover-custom"
  >
    <div class="me-2">
      <i class="{{ item.icon }}"></i>
    </div>
    <div class="d-flex flex-column">
      <span class="h6 fw-bold text-white mb-0">{{ item.label }}</span>
      <span class="small text-light opacity-50 d-none d-md-block">
        {{ item.subLAbel }}
      </span>
    </div>
  </a>
  }
</div>
