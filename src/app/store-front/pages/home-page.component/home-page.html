<h1>Todos los productos</h1>
<h2>para todos los gustos  {{ paginationService.currentPage() }} </h2>

<app-pagination  [pages]="productsResource.value()?.pages ?? 0 " [currentPage]="paginationService.currentPage()" ></app-pagination>

<div class="container fade-in ">
  <div class="row g-4">
    @for(product of productsResource.value()?.products; track $index) {
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 ">

      <product-cart [product]="product"></product-cart>
    </div>
    }

    @empty {
    <div class="alert alert-warning text-center">
      No se encontraron productos con los filtros aplicados.
    </div>
    }
  </div>
</div>
